# .github/workflows/push-workouts.yml
# Two-way sync: push planned structured workouts (Supabase planned_workouts)
# into Garmin, and schedule bank-sheet workouts onto the dates the coach
# wrote in column F of the workout-bank Google Sheet.
#
# Runs automatically twice a day, and can also be triggered by hand from
# the Actions tab. It writes to your real Garmin account, so it only ever
# ADDS/RESCHEDULES workouts - it never deletes anything. Re-running is safe:
# find_workout_id reuses existing workouts instead of duplicating them,
# schedule_if_absent skips a date already booked, and dedupe_calendar
# removes any leftover duplicates - so running this twice a day never
# double-books a workout.

name: push-workouts

on:
  workflow_dispatch: {}
  schedule:
    # 04:00 and 16:00 UTC = 07:00 and 19:00 Israel.
    - cron: "0 4 * * *"
    - cron: "0 16 * * *"

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-sync.txt

      - name: Write Google service-account credentials
        run: echo '${{ secrets.GOOGLE_CREDENTIALS }}' > google_credentials.json

      - name: Pull Spark's new plans (and post-run feedback) from Calendar
        # Spark (the Gemini coach) writes new plans to Google Calendar; this
        # step reads events with an embedded workout spec and upserts them
        # into planned_workouts as status='pending', so the push step below
        # picks them up automatically - no manual SQL needed.
        #
        # It also looks for a ###POST_RUN### block (RPE/shoes/notes) Spark
        # writes on a past event once the athlete reports it in chat, and
        # copies those fields into run_history - Spark has no working direct
        # write path into the Google Sheets, so this Calendar round-trip is
        # the only durable place that feedback can land. sync.yml's
        # supabase_to_sheets.py then carries it into the Sheet on its next run.
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APP_USER_ID: ${{ secrets.APP_USER_ID }}
          CALENDAR_ID: ${{ secrets.CALENDAR_ID }}
        run: python calendar_to_supabase.py

      - name: Push planned + bank-sheet workouts to Garmin
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APP_USER_ID: ${{ secrets.APP_USER_ID }}
        run: python garmin_workout_builder.py
