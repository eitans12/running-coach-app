# .github/workflows/weekly-whatsapp.yml
#
# Every Sunday: pull Spark's freshly-built weekly plan from Google Calendar
# into Supabase, then send Ron a WhatsApp summary (day-by-day plan + an
# estimated weekly kilometrage, no nutrition).
#
# Triggered by cron-job.org hitting workflow_dispatch (GitHub's own `schedule:`
# trigger is unreliable - see push-workouts.yml / sync.yml for the same
# pattern), a little after Spark's Sunday-morning auto-planning run.
#
# Spark's own planning run doesn't have a guaranteed finish time, so one
# single Sunday-morning shot can (and did - run #11, 2026-10-25) land before
# Spark has written the week to Calendar: weekly_whatsapp_to_ron.py then finds
# 0 planned_workouts and skips sending entirely, with no further attempt that
# day. To make this self-healing instead of a silent miss, GitHub's own
# `schedule:` now fires every two hours through Sunday (not just once) as a
# real retry loop, not just a best-effort fallback. weekly_whatsapp_to_ron.py
# is retry-safe: it records a `weekly_whatsapp_log` row once it actually sends,
# and every later run that day checks that first and exits immediately if
# already sent - so these extra attempts can never double-send Ron.

name: weekly-whatsapp

on:
  workflow_dispatch: {}
  schedule:
    # Retry loop, every 2h Sun 07:00-19:00 UTC = 10:00-22:00 Israel. Each run
    # is a no-op (one cheap Supabase lookup) once a day's send has already
    # gone out - see weekly_whatsapp_to_ron.py's already_sent() check.
    - cron: "0 7,9,11,13,15,17,19 * * 0"

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-sync.txt

      - name: Write Google service-account credentials
        run: echo '${{ secrets.GOOGLE_CREDENTIALS }}' > google_credentials.json

      - name: Pull this week's plan from Google Calendar into Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APP_USER_ID: ${{ secrets.APP_USER_ID }}
        run: python calendar_to_supabase.py

      - name: Send weekly plan to Ron on WhatsApp
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APP_USER_ID: ${{ secrets.APP_USER_ID }}
          GREEN_API_ID_INSTANCE: ${{ secrets.GREEN_API_ID_INSTANCE }}
          GREEN_API_TOKEN_INSTANCE: ${{ secrets.GREEN_API_TOKEN_INSTANCE }}
          RON_WHATSAPP_NUMBER: ${{ secrets.RON_WHATSAPP_NUMBER }}
        run: python weekly_whatsapp_to_ron.py
