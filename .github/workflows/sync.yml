# .github/workflows/sync.yml
# Automatic daily pipeline for ai-running-coach:
#   Garmin -> Supabase -> Google Sheets
#
# Runs on GitHub's servers on a schedule, so it works even when the
# Codespace is closed. Set the repo secrets listed in README_sync.md first.

name: running-coach-sync

on:
  schedule:
    # All times UTC. Israel is UTC+3, so 07:00-09:00 UTC = 10:00-12:00 Israel.
    #
    # GitHub's scheduler is best-effort and can run a scheduled job hours
    # late, so instead of one run at 10:00 we fire five times across the
    # morning. The sync is idempotent (it upserts by date), so each extra
    # run just refreshes the same rows - harmless - and only raises the
    # odds that at least one lands close to when you actually check in.
    - cron: "0 7 * * *"    # Runs at 10:00 Israel
    - cron: "30 7 * * *"   # Runs at 10:30 Israel
    - cron: "0 8 * * *"    # Runs at 11:00 Israel
    - cron: "30 8 * * *"   # Runs at 11:30 Israel
    - cron: "0 9 * * *"    # Runs at 12:00 Israel
  workflow_dispatch: {}          # lets you (or a phone shortcut) run it on demand
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-sync.txt

      - name: Write Google service-account credentials
        run: printf '%s' "$GOOGLE_CREDENTIALS" > google_credentials.json
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}

      - name: Garmin -> Supabase
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APP_USER_ID: ${{ secrets.APP_USER_ID }}
          SYNC_DAYS: "30"
        run: python garmin_to_supabase.py

      - name: Supabase -> Google Sheets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APP_USER_ID: ${{ secrets.APP_USER_ID }}
        run: python supabase_to_sheets.py

      - name: Garmin per-km splits -> Sheet (for the coach)
        # Best-effort extra: never let a splits hiccup fail the core sync or
        # send a failure email. The important Garmin->Supabase->Sheets steps
        # above have already run by this point.
        continue-on-error: true
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: python garmin_splits_to_sheet.py
