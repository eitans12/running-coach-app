# .github/workflows/sync.yml
# Automatic daily pipeline for ai-running-coach:
#   Garmin -> Supabase -> Google Sheets
#
# Runs on GitHub's servers on a schedule, so it works even when the
# Codespace is closed. Set the repo secrets listed in README_sync.md first.

name: running-coach-sync

on:
  schedule:
    # All times UTC. Israel = UTC+3, so:
    #   06:00 / 06:30 / 07:00 UTC  ->  09:00 / 09:30 / 10:00 Israel  (MORNING)
    #   11:00 UTC                  ->  14:00 Israel                  (afternoon)
    #   16:00 UTC                  ->  19:00 Israel                  (evening)
    #
    # The 09:00 morning run is the anchor: recovery metrics (HRV, sleep, RHR)
    # are only reliable after you wake and the watch has synced the night.
    # GitHub's scheduler is best-effort and regularly DELAYS or even DROPS a
    # scheduled run - the 09:00 slot was skipped several mornings in a row - so
    # we fire the morning THREE times (09:00, 09:30, 10:00 Israel). The whole
    # sync is idempotent (it upserts by date), so a repeat run just refreshes
    # the same rows and is completely harmless; the extra attempts only raise
    # the odds that at least one actually lands in the morning.
    - cron: "0 6 * * *"
    - cron: "30 6 * * *"
    - cron: "0 7 * * *"
    - cron: "0 11,16 * * *"
  workflow_dispatch: {}          # lets you (or a phone shortcut) run it on demand

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-sync.txt

      - name: Write Google service-account credentials
        run: printf '%s' "$GOOGLE_CREDENTIALS" > google_credentials.json
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}

      - name: Garmin -> Supabase
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APP_USER_ID: ${{ secrets.APP_USER_ID }}
          SYNC_DAYS: "30"
        run: python garmin_to_supabase.py

      - name: Supabase -> Google Sheets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APP_USER_ID: ${{ secrets.APP_USER_ID }}
        run: python supabase_to_sheets.py

      - name: Garmin per-km splits -> Sheet (for the coach)
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: python garmin_splits_to_sheet.py
